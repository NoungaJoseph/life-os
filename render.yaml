services:
  - type: web
    name: my-life-os-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install --include=dev && npm run build && npm run migrate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false   # include your web app origin, e.g. https://my-life-os-web.vercel.app
      - key: ENABLE_SCHEDULER
        value: 'true'  # sends reminder push notifications; the free plan sleeps when idle, so use a paid plan for on-time reminders
      - key: PAYMENTS_MODE
        value: sandbox
      - key: PAYMENTS_WEBHOOK_SECRET
        sync: false
      - key: MTN_MOMO_API_KEY
        sync: false
      - key: ORANGE_MONEY_API_KEY
        sync: false
